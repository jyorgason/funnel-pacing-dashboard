<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Funnel Pacing — May 2026</title>
<link rel="stylesheet" href="fabric-tokens.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--gray-05); }
  .page { padding: 40px 32px 64px; display: flex; justify-content: center; overflow-x: auto; }
  .board-wrap { width: 100%; min-width: 1124px; max-width: 1200px; }

  /* editable summary affordances */
  .es-edit { outline: none; border-radius: 5px; padding: 1px 4px; margin: 0 -4px; transition: background .12s, box-shadow .12s; }
  .es-edit:hover { background: rgba(0,0,0,.025); }
  .es-edit:focus { background: var(--white); box-shadow: 0 0 0 2px var(--primary-300); }
  .es-edit:empty::before { content: "Write a summary…"; color: var(--gray-4); }

  .es-tools { opacity: 0; transition: opacity .15s ease; }
  .es-callout:hover .es-tools,
  .es-callout:focus-within .es-tools { opacity: 1; }
  .es-tools button:hover { background: var(--gray-1) !important; }

  /* editable table cell affordances */
  .cell-editable { border-radius: 4px; padding: 1px 4px; margin: 0 -4px; transition: background .12s; }
  .cell-editable:hover { background: rgba(0,0,0,.04); }
  .cell-revert { opacity: 0; transition: opacity .15s ease; }
  .cell-editable:hover .cell-revert { opacity: 1; }

  @media print { .es-tools { display: none !important; } body { background: #fff; } }
</style>
</head>
<body>
<div class="page"><div class="board-wrap"><div id="root"></div></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="board.jsx"></script>
<script type="text/babel" src="dir-table.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>

<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById("root")).render(<window.PacingDashboard />);
</script>
</body>
</html>
